name: Staging CI/CD Pipeline

# Trigger on commits to staging branch
on:
  push:
    branches:
      - staging

env:
  DOCKER_IMAGE_NAME: fastapi-trip-app
  DOCKER_TAG: staging-${{ github.sha }}

jobs:
  # Job 1: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h "127.0.0.1" -P 3306 --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Test database connection
        env:
          DB_CONNECTION_STRING: mysql+pymysql://root:testpassword@localhost:3306/testdb
        run: |
          python -c "
          from database import engine
          from sqlalchemy import text
          with engine.connect() as conn:
              result = conn.execute(text('SELECT 1'))
              print('Database connection successful!')
          "

      - name: Test application startup
        env:
          DB_CONNECTION_STRING: mysql+pymysql://root:testpassword@localhost:3306/testdb
        run: |
          python -c "
          import models
          from database import engine
          models.Base.metadata.create_all(bind=engine)
          print('Application models created successfully!')
          "

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} .
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} ${{ env.DOCKER_IMAGE_NAME }}:staging-latest

      - name: Test Docker container
        run: |
          # Start the container in background
          docker run -d --name test-container \
            --network host \
            -e DB_CONNECTION_STRING="mysql+pymysql://root:testpassword@localhost:3306/testdb" \
            ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          
          # Wait for container to start
          sleep 15
          
          # Test the API
          curl -f http://localhost:8000/ || (docker logs test-container && exit 1)
          
          # Test trip endpoint
          curl -f http://localhost:8000/trip || (docker logs test-container && exit 1)
          
          echo "✅ Docker container test passed!"
          
          # Cleanup
          docker stop test-container
          docker rm test-container

  # Job 2: Deploy to Staging Environment
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/staging'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} .

      # Option A: Deploy to Docker Hub (uncomment to use)
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      
      # - name: Push to Docker Hub
      #   run: |
      #     docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
      #     docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:staging-latest
      #     docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
      #     docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:staging-latest

      # Option B: Deploy via SSH to staging server (uncomment to use)
      # - name: Deploy to staging server
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ secrets.STAGING_HOST }}
      #     username: ${{ secrets.STAGING_USER }}
      #     key: ${{ secrets.STAGING_SSH_KEY }}
      #     script: |
      #       cd /path/to/your/app
      #       docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:staging-latest
      #       docker-compose down
      #       docker-compose up -d
      #       sleep 10
      #       curl -f http://localhost:8000/ || exit 1

      # Option C: Deploy to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Registry
        run: |
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} ghcr.io/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} ghcr.io/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:staging-latest
          docker push ghcr.io/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          docker push ghcr.io/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:staging-latest

      # Simulate staging deployment (replace with your actual deployment method)
      - name: Deploy to staging environment
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Image: ghcr.io/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          
          # Example deployment commands (customize for your infrastructure):
          # - Deploy to Kubernetes: kubectl set image deployment/app container=ghcr.io/...
          # - Deploy to Docker Swarm: docker service update --image ghcr.io/...
          # - Deploy to cloud platforms: platform-specific commands

      - name: Run staging smoke tests
        run: |
          echo "🧪 Running smoke tests on staging..."
          
          # Replace with your actual staging URL
          STAGING_URL="https://your-staging-app.herokuapp.com"  # or your staging domain
          
          # Basic smoke tests (customize for your app)
          echo "Testing health endpoint..."
          # curl -f $STAGING_URL/ || exit 1
          
          echo "Testing API endpoints..."
          # curl -f $STAGING_URL/trip || exit 1
          
          echo "✅ Staging smoke tests passed!"

      - name: Deployment summary
        run: |
          echo "## 🎉 Staging Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ghcr.io/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at**: $(date)" >> $GITHUB_STEP_SUMMARY
